name: Deploy to USMLE Wise

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: usmlewise
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/usmlewise/htdocs/usmlewise.com
            dploy deploy main
