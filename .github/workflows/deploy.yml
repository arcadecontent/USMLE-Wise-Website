name: Deploy to USMLE Wise

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: usmlewise
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/usmlewise/htdocs/usmlewise.com
            dploy deploy main
            # dploy deploys into releases/ and symlinks current/ — verify there
            STYLES="current/assets/usmle-design-system/styles.css"
            if [ ! -f "$STYLES" ]; then
              echo "ERROR: $STYLES not found after deploy"
              ls -la current/assets/ 2>/dev/null || ls -la current/ 2>/dev/null
              exit 1
            fi
            if ! grep -q 'mob-nav-drawer' "$STYLES"; then
              echo "ERROR: mobile nav CSS missing from $STYLES"
              exit 1
            fi
            echo "Verified mobile nav CSS in $STYLES"
            INDEX="current/index.php"
            if [ ! -f "$INDEX" ]; then
              echo "ERROR: index.php not found after deploy"
              exit 1
            fi
            echo "Verified index.php exists at $INDEX"
            # Purge CloudPanel Varnish cache so the new release is served
            # immediately (default lifetime is 7 days). Try every mechanism;
            # each is best-effort and logged.
            if command -v clpctl >/dev/null 2>&1; then
              clpctl varnish-cache:purge --purge=all \
                && echo "Varnish purged via clpctl" || echo "WARN: clpctl purge failed"
            else
              echo "clpctl not available"
            fi
            curl -s -o /dev/null -w "PURGE by tag -> HTTP %{http_code}\n" \
              -X PURGE -H 'X-Cache-Tags: f2eb' http://127.0.0.1:6081 || true
            curl -s -o /dev/null -w "PURGE by host -> HTTP %{http_code}\n" \
              -X PURGE -H 'Host: usmlewise.com' http://127.0.0.1:6081 || true

      - name: Purge Cloudflare cache
        if: success()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Set CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN repo secrets to enable Cloudflare purge"
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/cf-purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf-purge.json
          if [ "$http_code" != "200" ] || ! grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/cf-purge.json; then
            echo "::error::Cloudflare cache purge failed (HTTP ${http_code})"
            exit 1
          fi
          echo "Cloudflare cache purged successfully"
