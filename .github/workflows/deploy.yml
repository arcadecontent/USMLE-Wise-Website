name: Deploy to USMLE Wise

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: usmlewise
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/usmlewise/htdocs/usmlewise.com
            dploy deploy main
            # Verify mobile nav CSS actually landed (dploy can skip paths with spaces)
            if ! grep -q 'mob-nav-drawer' assets/usmle-design-system/styles.css; then
              echo "styles.css stale — forcing git sync"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            fi
            grep -q 'mob-nav-drawer' assets/usmle-design-system/styles.css || exit 1
