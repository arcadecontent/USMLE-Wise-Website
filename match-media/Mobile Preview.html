<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Preview — USMLE Wise Match Packages</title>
<style>
  html,body{margin:0;height:100%;background:#1c1c22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 16px 40px;box-sizing:border-box}
  .label{color:#9a9aa6;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:"JetBrains Mono",ui-monospace,monospace}
  .phone{
    width:390px;height:844px;max-width:calc(100vw - 32px);
    background:#000;border-radius:46px;padding:12px;
    box-shadow:0 40px 90px rgba(0,0,0,.5), 0 0 0 2px #2c2c34;
    position:relative;box-sizing:border-box;flex:0 0 auto;
  }
  .screen{
    width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff;position:relative;
  }
  .notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:5;
  }
  iframe{width:390px;height:844px;border:0;display:block}
  /* scale the 390px iframe to the padded screen width */
  .screen iframe{width:366px;height:820px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">iPhone · 390 × 844 · scroll inside the frame</div>
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <iframe src="MatchPackages.dc.html" title="Mobile preview"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
