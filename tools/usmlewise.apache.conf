# Local Apache vhost for USMLE Wise PHP site
# Install: sudo bash tools/setup-apache-local.sh

<VirtualHost *:80>
    ServerName usmlewise.local
    ServerAlias www.usmlewise.local
    DocumentRoot /home/hassam/Desktop/htdocs/usmlewise_new_site

    <Directory /home/hassam/Desktop/htdocs/usmlewise_new_site>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/usmlewise-error.log
    CustomLog ${APACHE_LOG_DIR}/usmlewise-access.log combined
</VirtualHost>
