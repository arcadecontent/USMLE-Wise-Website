<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile preview</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F2F2EF; font-family:system-ui,sans-serif; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 0; }
  .label { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#78787a; }
  .phone { width:390px; height:844px; border:12px solid #14151c; border-radius:44px; overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,.22); background:#fff; }
  iframe { width:390px; height:820px; border:0; display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">iPhone 390 × 844</div>
    <div class="phone"><iframe src="1st Attempt Match System.dc.html" title="Mobile preview"></iframe></div>
  </div>
</body>
</html>
